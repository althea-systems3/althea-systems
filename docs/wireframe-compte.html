<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Wireframe — Espace Client</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; font-family: 'Segoe UI', sans-serif; background: #f2f2f2; color: #333; }

    .label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: #888; }
    .title-label { font-size: 12px; font-weight: 700; color: #555; text-transform: uppercase; letter-spacing: 1px; }

    /* HEADER */
    header {
      background: #d8d8d8;
      height: 60px;
      display: flex;
      align-items: center;
      padding: 0 40px;
      border-bottom: 2px solid #bbb;
      gap: 20px;
    }
    .logo-box { width: 120px; height: 36px; background: #bbb; border-radius: 4px; display: flex; align-items: center; justify-content: center; }
    nav { display: flex; gap: 24px; flex: 1; justify-content: center; }
    .nav-item { width: 80px; height: 14px; background: #bbb; border-radius: 3px; }
    .header-icons { display: flex; gap: 16px; }
    .icon-box { width: 32px; height: 32px; background: #bbb; border-radius: 50%; }

    /* ACCOUNT HEADER */
    .account-header {
      background: #e0e0e0;
      padding: 24px 40px;
      display: flex;
      align-items: center;
      gap: 20px;
      border-bottom: 1px solid #ccc;
    }
    .avatar { width: 56px; height: 56px; background: #bbb; border-radius: 50%; flex-shrink: 0; }
    .user-info { display: flex; flex-direction: column; gap: 6px; }
    .user-name { height: 14px; background: #aaa; border-radius: 3px; width: 140px; }
    .user-email { height: 9px; background: #ccc; border-radius: 3px; width: 180px; }
    .user-since { height: 8px; background: #d0d0d0; border-radius: 3px; width: 120px; }

    /* MAIN LAYOUT */
    .account-main {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 0;
      min-height: calc(100vh - 200px);
    }

    /* SIDEBAR NAV */
    .account-nav {
      background: #e8e8e8;
      border-right: 2px dashed #ccc;
      padding: 20px 0;
      display: flex;
      flex-direction: column;
    }
    .nav-section-title { padding: 8px 20px; height: 8px; background: #ccc; border-radius: 3px; width: 60%; margin: 0 20px 8px; }
    .nav-link {
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-left: 3px solid transparent;
    }
    .nav-link.active { background: #ddd; border-left-color: #999; }
    .nav-icon { width: 16px; height: 16px; background: #bbb; border-radius: 3px; flex-shrink: 0; }
    .nav-icon.active { background: #999; }
    .nav-text { height: 9px; background: #ccc; border-radius: 3px; flex: 1; }
    .nav-text.active { background: #aaa; }
    .nav-divider { height: 1px; background: #ccc; margin: 12px 0; }

    /* CONTENT AREA */
    .account-content {
      background: #fff;
      padding: 32px 40px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* DASHBOARD CARDS */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .dash-card {
      background: #e8e8e8;
      border: 1.5px dashed #bbb;
      border-radius: 6px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .dash-icon { width: 32px; height: 32px; background: #bbb; border-radius: 6px; }
    .dash-number { height: 20px; background: #aaa; border-radius: 4px; width: 60px; }
    .dash-label { height: 8px; background: #ccc; border-radius: 3px; width: 80%; }

    /* ORDERS TABLE */
    .orders-section { display: flex; flex-direction: column; gap: 12px; }
    .table-header {
      display: grid;
      grid-template-columns: 1fr 1.5fr 1fr 1fr 1fr;
      gap: 12px;
      padding: 10px 14px;
      background: #e8e8e8;
      border-radius: 4px;
    }
    .th { height: 9px; background: #aaa; border-radius: 3px; }
    .table-row {
      display: grid;
      grid-template-columns: 1fr 1.5fr 1fr 1fr 1fr;
      gap: 12px;
      padding: 12px 14px;
      background: #f5f5f5;
      border-radius: 4px;
      border: 1px solid #e0e0e0;
      align-items: center;
    }
    .td { height: 8px; background: #ccc; border-radius: 3px; }
    .status-badge { height: 20px; background: #bbb; border-radius: 10px; width: 70px; }

    /* INVOICES */
    .invoice-list { display: flex; flex-direction: column; gap: 10px; }
    .invoice-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 14px;
      background: #f5f5f5;
      border-radius: 4px;
      border: 1px solid #e0e0e0;
    }
    .inv-icon { width: 32px; height: 32px; background: #ccc; border-radius: 4px; flex-shrink: 0; }
    .inv-name { height: 9px; background: #bbb; border-radius: 3px; flex: 1; }
    .inv-date { height: 8px; background: #ccc; border-radius: 3px; width: 80px; }
    .inv-amount { height: 10px; background: #aaa; border-radius: 3px; width: 70px; }
    .inv-btn { width: 80px; height: 28px; background: #bbb; border-radius: 4px; flex-shrink: 0; }

    /* FOOTER */
    footer {
      background: #c8c8c8;
      padding: 24px 40px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      border-top: 2px solid #bbb;
    }
    .footer-col { display: flex; flex-direction: column; gap: 8px; }
    .footer-line { height: 8px; background: #aaa; border-radius: 3px; }
  </style>
</head>
<body>

  <header>
    <div class="logo-box"><span class="label">Logo</span></div>
    <nav>
      <div class="nav-item"></div>
      <div class="nav-item"></div>
      <div class="nav-item"></div>
      <div class="nav-item"></div>
    </nav>
    <div class="header-icons">
      <div class="icon-box"></div>
      <div class="icon-box"></div>
      <div class="icon-box"></div>
    </div>
  </header>

  <div class="account-header">
    <div class="avatar"></div>
    <div class="user-info">
      <div class="user-name"></div>
      <div class="user-email"></div>
      <div class="user-since"></div>
    </div>
  </div>

  <div class="account-main">

    <div class="account-nav">
      <div class="nav-section-title"></div>
      <div class="nav-link active">
        <div class="nav-icon active"></div>
        <div class="nav-text active"></div>
      </div>
      <div class="nav-link">
        <div class="nav-icon"></div>
        <div class="nav-text"></div>
      </div>
      <div class="nav-link">
        <div class="nav-icon"></div>
        <div class="nav-text"></div>
      </div>
      <div class="nav-divider"></div>
      <div class="nav-section-title"></div>
      <div class="nav-link">
        <div class="nav-icon"></div>
        <div class="nav-text"></div>
      </div>
      <div class="nav-link">
        <div class="nav-icon"></div>
        <div class="nav-text"></div>
      </div>
      <div class="nav-divider"></div>
      <div class="nav-link">
        <div class="nav-icon"></div>
        <div class="nav-text" style="width:40%;"></div>
      </div>
    </div>

    <div class="account-content">
      <div class="title-label">Tableau de bord</div>

      <div class="dashboard-grid">
        <div class="dash-card">
          <div class="dash-icon"></div>
          <div class="dash-number"></div>
          <div class="dash-label"></div>
        </div>
        <div class="dash-card">
          <div class="dash-icon"></div>
          <div class="dash-number"></div>
          <div class="dash-label"></div>
        </div>
        <div class="dash-card">
          <div class="dash-icon"></div>
          <div class="dash-number"></div>
          <div class="dash-label"></div>
        </div>
      </div>

      <div class="orders-section">
        <div class="title-label">Commandes récentes</div>
        <div class="table-header">
          <div class="th" style="width:70%;"></div>
          <div class="th" style="width:80%;"></div>
          <div class="th" style="width:60%;"></div>
          <div class="th" style="width:65%;"></div>
          <div class="th" style="width:50%;"></div>
        </div>
        <div class="table-row">
          <div class="td" style="width:80%;"></div>
          <div class="td" style="width:70%;"></div>
          <div class="td" style="width:55%;"></div>
          <div class="status-badge"></div>
          <div class="td" style="width:50%;"></div>
        </div>
        <div class="table-row">
          <div class="td" style="width:75%;"></div>
          <div class="td" style="width:65%;"></div>
          <div class="td" style="width:50%;"></div>
          <div class="status-badge" style="width:60px;"></div>
          <div class="td" style="width:45%;"></div>
        </div>
        <div class="table-row">
          <div class="td" style="width:70%;"></div>
          <div class="td" style="width:60%;"></div>
          <div class="td" style="width:55%;"></div>
          <div class="status-badge" style="width:80px;"></div>
          <div class="td" style="width:50%;"></div>
        </div>
      </div>

      <div>
        <div class="title-label" style="margin-bottom:12px;">Dernières factures</div>
        <div class="invoice-list">
          <div class="invoice-row">
            <div class="inv-icon"></div>
            <div class="inv-name"></div>
            <div class="inv-date"></div>
            <div class="inv-amount"></div>
            <div class="inv-btn"></div>
          </div>
          <div class="invoice-row">
            <div class="inv-icon"></div>
            <div class="inv-name" style="width:60%;"></div>
            <div class="inv-date"></div>
            <div class="inv-amount"></div>
            <div class="inv-btn"></div>
          </div>
          <div class="invoice-row">
            <div class="inv-icon"></div>
            <div class="inv-name" style="width:70%;"></div>
            <div class="inv-date"></div>
            <div class="inv-amount"></div>
            <div class="inv-btn"></div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <footer>
    <div class="footer-col">
      <div class="footer-line" style="width:80%; height:12px; background:#999;"></div>
      <div class="footer-line" style="width:60%;"></div>
      <div class="footer-line" style="width:50%;"></div>
    </div>
    <div class="footer-col">
      <div class="footer-line" style="width:70%; height:12px; background:#999;"></div>
      <div class="footer-line" style="width:55%;"></div>
    </div>
    <div class="footer-col">
      <div class="footer-line" style="width:70%; height:12px; background:#999;"></div>
      <div class="footer-line" style="width:50%;"></div>
    </div>
    <div class="footer-col">
      <div class="footer-line" style="width:60%; height:12px; background:#999;"></div>
      <div class="footer-line" style="width:40%;"></div>
    </div>
  </footer>

</body>
</html>
