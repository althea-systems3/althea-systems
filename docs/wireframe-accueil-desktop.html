<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Wireframe — Accueil Desktop</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; font-family: 'Segoe UI', sans-serif; background: #f2f2f2; color: #333; }

    .label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: #888; }
    .title-label { font-size: 12px; font-weight: 700; color: #555; text-transform: uppercase; letter-spacing: 1px; }

    /* HEADER */
    header {
      background: #d8d8d8;
      height: 60px;
      display: flex;
      align-items: center;
      padding: 0 40px;
      border-bottom: 2px solid #bbb;
      gap: 20px;
    }
    .logo-box {
      width: 120px; height: 36px;
      background: #bbb;
      border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
    }
    nav { display: flex; gap: 24px; flex: 1; justify-content: center; }
    .nav-item { width: 80px; height: 14px; background: #bbb; border-radius: 3px; }
    .header-icons { display: flex; gap: 16px; align-items: center; }
    .icon-box { width: 32px; height: 32px; background: #bbb; border-radius: 50%; }

    /* HERO */
    .hero {
      background: #ccc;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 60px;
      position: relative;
      border-bottom: 2px dashed #aaa;
    }
    .hero-arrow { width: 36px; height: 36px; background: #aaa; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #fff; cursor: pointer; }
    .hero-content { text-align: center; }
    .hero-title { width: 300px; height: 20px; background: #aaa; border-radius: 4px; margin: 0 auto 12px; }
    .hero-sub { width: 200px; height: 12px; background: #bbb; border-radius: 3px; margin: 0 auto 16px; }
    .hero-btn { width: 120px; height: 32px; background: #999; border-radius: 4px; margin: 0 auto; }
    .hero-dots { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #aaa; }
    .dot.active { background: #666; }

    /* SECTION */
    section { padding: 32px 40px; border-bottom: 1px dashed #ccc; }
    .section-title { width: 200px; height: 16px; background: #ccc; border-radius: 4px; margin-bottom: 20px; }

    /* GRID */
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }

    .cat-card {
      background: #e8e8e8;
      border: 1.5px dashed #bbb;
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .img-placeholder {
      width: 100%;
      height: 80px;
      background: #ccc;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #aaa;
    }
    .cat-label { width: 80%; height: 10px; background: #bbb; border-radius: 3px; }

    .prod-card {
      background: #e8e8e8;
      border: 1.5px dashed #bbb;
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .prod-img { width: 100%; height: 100px; background: #ccc; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #aaa; }
    .prod-title { width: 90%; height: 10px; background: #bbb; border-radius: 3px; }
    .prod-subtitle { width: 60%; height: 8px; background: #ccc; border-radius: 3px; }
    .prod-price { width: 50%; height: 12px; background: #aaa; border-radius: 3px; }
    .prod-btn { width: 100%; height: 28px; background: #aaa; border-radius: 4px; }

    /* FOOTER */
    footer {
      background: #c8c8c8;
      padding: 28px 40px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      border-top: 2px solid #bbb;
    }
    .footer-col { display: flex; flex-direction: column; gap: 8px; }
    .footer-line { height: 8px; background: #aaa; border-radius: 3px; }
    .footer-line.short { width: 60%; }
  </style>
</head>
<body>

  <header>
    <div class="logo-box"><span class="label">Logo</span></div>
    <nav>
      <div class="nav-item"></div>
      <div class="nav-item"></div>
      <div class="nav-item"></div>
      <div class="nav-item"></div>
    </nav>
    <div class="header-icons">
      <div class="icon-box"></div>
      <div class="icon-box"></div>
      <div class="icon-box"></div>
      <div class="icon-box"></div>
    </div>
  </header>

  <div class="hero">
    <div class="hero-arrow">‹</div>
    <div class="hero-content">
      <div class="title-label" style="color:#777; margin-bottom:12px;">Carrousel éditorial</div>
      <div class="hero-title"></div>
      <div class="hero-sub"></div>
      <div class="hero-btn"></div>
    </div>
    <div class="hero-arrow">›</div>
    <div class="hero-dots">
      <div class="dot active"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

  <section>
    <div class="title-label" style="margin-bottom:20px;">Nos catégories</div>
    <div class="grid-4">
      <div class="cat-card"><div class="img-placeholder">⬜</div><div class="cat-label"></div></div>
      <div class="cat-card"><div class="img-placeholder">⬜</div><div class="cat-label"></div></div>
      <div class="cat-card"><div class="img-placeholder">⬜</div><div class="cat-label"></div></div>
      <div class="cat-card"><div class="img-placeholder">⬜</div><div class="cat-label"></div></div>
    </div>
  </section>

  <section>
    <div class="title-label" style="margin-bottom:20px;">Top produits</div>
    <div class="grid-4">
      <div class="prod-card"><div class="prod-img">⬜</div><div class="prod-title"></div><div class="prod-subtitle"></div><div class="prod-price"></div><div class="prod-btn"></div></div>
      <div class="prod-card"><div class="prod-img">⬜</div><div class="prod-title"></div><div class="prod-subtitle"></div><div class="prod-price"></div><div class="prod-btn"></div></div>
      <div class="prod-card"><div class="prod-img">⬜</div><div class="prod-title"></div><div class="prod-subtitle"></div><div class="prod-price"></div><div class="prod-btn"></div></div>
      <div class="prod-card"><div class="prod-img">⬜</div><div class="prod-title"></div><div class="prod-subtitle"></div><div class="prod-price"></div><div class="prod-btn"></div></div>
    </div>
  </section>

  <footer>
    <div class="footer-col">
      <div class="footer-line" style="width:80%; height:12px; background:#999;"></div>
      <div class="footer-line short"></div>
      <div class="footer-line short"></div>
      <div class="footer-line" style="width:40%;"></div>
    </div>
    <div class="footer-col">
      <div class="footer-line" style="width:70%; height:12px; background:#999;"></div>
      <div class="footer-line short"></div>
      <div class="footer-line short"></div>
      <div class="footer-line" style="width:45%;"></div>
    </div>
    <div class="footer-col">
      <div class="footer-line" style="width:70%; height:12px; background:#999;"></div>
      <div class="footer-line short"></div>
      <div class="footer-line short"></div>
    </div>
    <div class="footer-col">
      <div class="footer-line" style="width:60%; height:12px; background:#999;"></div>
      <div class="footer-line short"></div>
      <div class="footer-line" style="width:35%;"></div>
    </div>
  </footer>

</body>
</html>
