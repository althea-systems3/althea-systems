<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zoning — Page d'accueil</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Segoe UI', sans-serif;
      background: #fff;
    }

    .page {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100vh;
    }

    .zone {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 2px dashed rgba(255,255,255,0.2);
    }

    .z-header {
      background: #003d5c;
      color: #fff;
      height: 64px;
      flex-shrink: 0;
    }

    .z-hero {
      background: #00a8b5;
      color: #fff;
      height: 180px;
      flex-shrink: 0;
      font-size: 15px;
    }

    .z-categories {
      background: #e8f6f8;
      color: #003d5c;
      flex: 1;
    }

    .z-top-produits {
      background: #d0ecf0;
      color: #003d5c;
      flex: 1;
    }

    .z-footer {
      background: #1a3a4a;
      color: #aac8d8;
      height: 64px;
      flex-shrink: 0;
    }

    .grid-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      gap: 10px;
      padding: 16px;
    }

    .grid-label {
      font-size: 12px;
      font-weight: 700;
      color: #003d5c;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .cols {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 900px;
      flex: 1;
    }

    .col {
      flex: 1;
      border: 2px dashed #00a8b5;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #00a8b5;
      font-weight: 700;
      background: rgba(0,168,181,0.05);
    }
  </style>
</head>
<body>
  <div class="page">

    <div class="zone z-header">
      En-tête — Navigation · Sélecteur de langue · Panier · Compte
    </div>

    <div class="zone z-hero">
      Carrousel éditorial pleine largeur
    </div>

    <div class="zone z-categories">
      <div class="grid-inner">
        <div class="grid-label">Grille Catégories — 4 colonnes</div>
        <div class="cols">
          <div class="col">Catégorie 1</div>
          <div class="col">Catégorie 2</div>
          <div class="col">Catégorie 3</div>
          <div class="col">Catégorie 4</div>
        </div>
      </div>
    </div>

    <div class="zone z-top-produits">
      <div class="grid-inner">
        <div class="grid-label">Grille Top Produits — 4 colonnes</div>
        <div class="cols">
          <div class="col">Produit 1</div>
          <div class="col">Produit 2</div>
          <div class="col">Produit 3</div>
          <div class="col">Produit 4</div>
        </div>
      </div>
    </div>

    <div class="zone z-footer">
      Pied de page — Liens légaux · Contact
    </div>

  </div>
</body>
</html>
