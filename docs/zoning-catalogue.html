<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zoning — Page catalogue</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Segoe UI', sans-serif;
      background: #fff;
    }

    .page {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100vh;
    }

    .zone {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 2px dashed rgba(255,255,255,0.2);
    }

    .z-header {
      background: #003d5c;
      color: #fff;
      height: 64px;
      flex-shrink: 0;
    }

    .z-breadcrumb {
      background: #f0f4f6;
      color: #003d5c;
      height: 36px;
      flex-shrink: 0;
      font-size: 11px;
      border-bottom: 1px solid #d0dde5;
    }

    .z-banner {
      background: #00a8b5;
      color: #fff;
      height: 120px;
      flex-shrink: 0;
      font-size: 15px;
    }

    .z-main {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    .z-sidebar {
      width: 200px;
      background: #e8f0f4;
      display: flex;
      align-items: center;
      justify-content: center;
      border-right: 2px dashed #b0ccd8;
      flex-shrink: 0;
    }

    .sidebar-label {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-size: 13px;
      font-weight: 700;
      color: #003d5c;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .z-products {
      flex: 1;
      background: #fff;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      justify-content: center;
    }

    .prod-row {
      display: flex;
      gap: 12px;
      flex: 1;
    }

    .prod-item {
      flex: 1;
      border: 2px dashed #b0ccd8;
      border-radius: 6px;
      background: #f5f9fb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #003d5c;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .z-pagination {
      background: #f0f4f6;
      color: #003d5c;
      height: 44px;
      flex-shrink: 0;
      font-size: 11px;
      border-top: 1px solid #d0dde5;
    }

    .z-footer {
      background: #1a3a4a;
      color: #aac8d8;
      height: 64px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="page">

    <div class="zone z-header">
      En-tête — Navigation · Sélecteur de langue · Panier · Compte
    </div>

    <div class="zone z-breadcrumb">
      Fil d'Ariane — Accueil › Catégorie
    </div>

    <div class="zone z-banner">
      Bannière catégorie — Image · Titre · Description
    </div>

    <div class="z-main">
      <div class="z-sidebar">
        <div class="sidebar-label">Filtres</div>
      </div>
      <div class="z-products">
        <div class="prod-row">
          <div class="prod-item">Produit</div>
          <div class="prod-item">Produit</div>
          <div class="prod-item">Produit</div>
        </div>
        <div class="prod-row">
          <div class="prod-item">Produit</div>
          <div class="prod-item">Produit</div>
          <div class="prod-item">Produit</div>
        </div>
        <div class="prod-row">
          <div class="prod-item">Produit</div>
          <div class="prod-item">Produit</div>
          <div class="prod-item">Produit</div>
        </div>
      </div>
    </div>

    <div class="zone z-pagination">
      Pagination — Page 1 · 2 · 3 ...
    </div>

    <div class="zone z-footer">
      Pied de page — Liens légaux · Contact
    </div>

  </div>
</body>
</html>
